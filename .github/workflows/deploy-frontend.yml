name: Frontend CI + Deploy

on:
  push:
    branches: [main]
    paths:
      - "frontend/**"
      - ".github/workflows/deploy-frontend.yml"
  pull_request:
    paths:
      - "frontend/**"

jobs:
  check:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "npm"
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Type check
        run: npx tsc --noEmit

      - name: Unit tests
        run: npm run test

      - name: Build
        run: npm run build
        env:
          API_BASE_URL: https://www.kinocalendars.com

  e2e:
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: kino
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    env:
      DATABASE_URL: postgresql://postgres:postgres@localhost:5432/kino
      JWT_SECRET_KEY: ci-e2e-secret
      APP_BASE_URL: http://localhost:3000
      ENV: development
      TEST_RESET_SECRET: ci-e2e-reset-secret
      API_BASE_URL: http://localhost:8000
      E2E_TEST_EMAIL: e2e@test.example
      E2E_TEST_PASSWORD: e2e-password-123
      E2E_TEST_RESET_SECRET: ci-e2e-reset-secret

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"
          cache-dependency-path: backend/requirements.txt

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "npm"
          cache-dependency-path: frontend/package-lock.json

      - name: Set up database schema
        working-directory: backend
        env:
          PGPASSWORD: postgres
        run: |
          psql -h localhost -U postgres -d kino -v ON_ERROR_STOP=1 -f init.sql
          # Migrations not yet folded into init.sql, in dependency order
          for m in add_start_date_to_calendars add_calendar_expenses rename_event_costs_to_event_expenses; do
            psql -h localhost -U postgres -d kino -v ON_ERROR_STOP=1 -f "migrations/$m.sql"
          done

      - name: Install backend dependencies
        working-directory: backend
        run: pip install -r requirements.txt

      - name: Create e2e test user
        working-directory: backend
        # The reset endpoint needs TEST_USER_ID at startup, so the user is created before the API starts
        run: |
          USER_ID=$(python -c "
          import os, psycopg2
          from psycopg2.extras import RealDictCursor
          from app.crud.users import create_user
          from app.schemas.user import UserCreate
          conn = psycopg2.connect(os.environ['DATABASE_URL'], cursor_factory=RealDictCursor)
          user = create_user(conn, UserCreate(name='E2E Test User', email=os.environ['E2E_TEST_EMAIL'], password=os.environ['E2E_TEST_PASSWORD']))
          conn.commit()
          print(user['id'])
          ")
          echo "TEST_USER_ID=$USER_ID" >> "$GITHUB_ENV"

      - name: Start backend
        working-directory: backend
        run: |
          nohup uvicorn app.main:app --host 127.0.0.1 --port 8000 > ../backend.log 2>&1 &
          for i in $(seq 1 30); do
            curl -sf http://localhost:8000/ > /dev/null && exit 0
            sleep 1
          done
          echo "Backend did not start"; cat ../backend.log; exit 1

      - name: Install frontend dependencies
        working-directory: frontend
        run: npm ci

      - name: Install Playwright browser
        working-directory: frontend
        run: npx playwright install --with-deps chromium

      - name: Build frontend
        working-directory: frontend
        run: npm run build

      - name: Run e2e tests
        working-directory: frontend
        run: npx playwright test

      - name: Upload Playwright report
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: |
            frontend/playwright-report
            frontend/test-results
            backend.log
          retention-days: 7

  deploy:
    needs: [check, e2e]
    runs-on: ubuntu-latest
    environment: Production
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Deploy to Vercel
        run: npx vercel --prod --token=${{ secrets.VERCEL_TOKEN }} --yes
        env:
          VERCEL_ORG_ID: ${{ vars.VERCEL_ORG_ID }}
          VERCEL_PROJECT_ID: ${{ vars.VERCEL_PROJECT_ID }}
