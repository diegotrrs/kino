
scalar Date

type Calendar {
  id: ID!
  name: String! 
  location: String,
  startDate: Date!,
  endDate: Date!,
}

type Note {
  id: ID!
  name: String!
  completed: Boolean!
}

input CreateNoteInput {
  name: String!
  completed: Boolean!
}

input UpdateNoteInput {
  id: ID!
  name: String
  completed: Boolean
}

input CreateCalendarInput {
  name: String!  
  location: String,
  startDate: Date!,
  endDate: Date!,
}

type Query {
  getNoteById(noteId: String!): Note
  getCalendarById(calendarId: String!): Calendar
  getAllNotes: [Note]
  getAllCalendars: [Calendar!]!
}

type Mutation {
  createCalendar(input: CreateCalendarInput!): Calendar
  createNote(input: CreateNoteInput!): Note
  updateNote(input: UpdateNoteInput!): Note
  deleteNote(noteId: String!): String
}