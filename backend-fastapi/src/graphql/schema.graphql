type CalendarDateRange {
  from: String!,
  to: String!,
}

type Calendar {
  id: ID!
  category: String!,
  title: String!
  link: String!,
  content: String,
  dates: CalendarDateRange!,
  type: String!,  
}


type Note {
  id: ID!
  name: String!
  completed: Boolean!
}

input CreateNoteInput {
  id: ID
  name: String!
  completed: Boolean!
}

input UpdateNoteInput {
  id: ID!
  name: String
  completed: Boolean
}

type Query {
  getNoteById(noteId: String!): Note
  getAllNotes: [Note]
  users: String
}

type Mutation {
  createNote(input: CreateNoteInput!): Note
  updateNote(input: UpdateNoteInput!): Note
  deleteNote(noteId: String!): String
}